<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>DeMolay Sucre</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="auth" class="box" hidden>
  <h1>DeMolay Sucre</h1>
  <p>Campamento de Sucre. Acceso solo para miembros de la Orden DeMolay.</p>
  <form id="form">
    <div id="extra" hidden>
      <label for="nombre">Nombre completo</label><input id="nombre" autocomplete="name">
      <label for="codigo">Código de invitación</label><input id="codigo" autocomplete="off">
    </div>
    <label for="email">Correo</label><input id="email" type="email" autocomplete="email" required>
    <label for="pass">Contraseña</label><input id="pass" type="password" minlength="8" autocomplete="current-password" required>
    <p id="msg" role="alert"></p>
    <button class="btn" id="go">Entrar</button>
    <button class="link" id="toggle" type="button">Crear cuenta con código de invitación</button>
  </form>
</div>

<div id="pend" class="box" hidden>
  <h1>Cuenta pendiente</h1>
  <p>Tu cuenta espera la aprobación de un administrador. Vuelve a entrar cuando te avisen.</p>
  <button class="btn" id="out1">Salir</button>
</div>

<div id="app" hidden>
  <header>
    <button class="me" id="me" aria-label="Mi perfil"><span id="mav"></span><span id="mt"></span></button>
    <nav id="nav" aria-label="Secciones"></nav>
    <button class="btn alt" id="out2">Salir</button>
  </header>
  <main id="main"></main>
</div>
<dialog id="dlg"><div id="dimg"></div><h3 id="dt"></h3><p id="db"></p><button class="btn" id="dx">Cerrar</button></dialog>
<script type="module" src="app.js"></script>
</body>
</html>
